<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Contract Chill</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #FBFBFA;
        color: #1B1B18;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        text-align: center;
        max-width: 360px;
      }

      .icon-wrapper {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: rgba(27, 27, 24, 0.05);
        border-radius: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(27, 27, 24, 0.08);
      }

      .icon-wrapper svg {
        width: 40px;
        height: 40px;
        color: #6E6D68;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.04em;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 0.875rem;
        color: #6E6D68;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #FBFBFA;
        background: #1B1B18;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        transition: opacity 0.15s ease;
        font-family: inherit;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" x2="22" y1="2" y2="22"></line>
          <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
          <path d="M5 12.86a10 10 0 0 1 5.17-2.86"></path>
          <path d="m12 20 1.23-1.23"></path>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Some features require an internet connection. Cached pages are still available.</p>
      <button class="btn" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
          <path d="M8 16H3v5"></path>
        </svg>
        Try again
      </button>
    </div>
  </body>
</html>
